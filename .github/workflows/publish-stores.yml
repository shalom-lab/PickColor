name: Publish to Stores

# 手动触发，可以选择要发布的 tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-chrome:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 获取所有历史记录以便检查 tag
      
      - name: Validate tag exists
        id: validate-tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "Checking if tag $TAG exists..."
          
          # 获取所有 tags
          git fetch --tags
          
          # 检查 tag 是否存在
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists ✓"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Error: Tag '$TAG' does not exist!"
            echo "Available tags:"
            git tag -l | head -10
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Checkout tag
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.tag }}
      
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG"
      
      - name: Update manifest versions
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # 更新 Chrome manifest
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.chrome.json', 'utf8'));
            manifest.version = '$VERSION';
            fs.writeFileSync('manifest.chrome.json', JSON.stringify(manifest, null, 2));
          "
          # 更新 Firefox manifest
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.firefox.json', 'utf8'));
            manifest.version = '$VERSION';
            fs.writeFileSync('manifest.firefox.json', JSON.stringify(manifest, null, 2));
          "
          echo "Updated manifests to version $VERSION"
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Chrome extension
        run: npm run build:chrome
      
      - name: Create Chrome ZIP
        run: |
          cd dist
          zip -r ../pickcolor-chrome-${{ github.event.inputs.tag }}.zip .
          cd ..
      
      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickcolor-chrome
          path: pickcolor-chrome-${{ github.event.inputs.tag }}.zip

  build-firefox:
    name: Build Firefox Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 获取所有历史记录以便检查 tag
      
      - name: Validate tag exists
        id: validate-tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "Checking if tag $TAG exists..."
          
          # 获取所有 tags
          git fetch --tags
          
          # 检查 tag 是否存在
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists ✓"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Error: Tag '$TAG' does not exist!"
            echo "Available tags:"
            git tag -l | head -10
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Checkout tag
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.tag }}
      
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG"
      
      - name: Update manifest versions
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # 更新 Chrome manifest
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.chrome.json', 'utf8'));
            manifest.version = '$VERSION';
            fs.writeFileSync('manifest.chrome.json', JSON.stringify(manifest, null, 2));
          "
          # 更新 Firefox manifest
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.firefox.json', 'utf8'));
            manifest.version = '$VERSION';
            fs.writeFileSync('manifest.firefox.json', JSON.stringify(manifest, null, 2));
          "
          echo "Updated manifests to version $VERSION"
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Firefox extension
        run: npm run build:firefox
      
      - name: Create Firefox ZIP
        run: |
          cd dist
          zip -r ../pickcolor-firefox-${{ github.event.inputs.tag }}.zip .
          cd ..
      
      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickcolor-firefox
          path: pickcolor-firefox-${{ github.event.inputs.tag }}.zip

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: [build-chrome]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.tag }}
      
      - name: Download Chrome artifact
        uses: actions/download-artifact@v4
        with:
          name: pickcolor-chrome
          path: .
      
      - name: Publish to Chrome Web Store
        if: ${{ secrets.CHROME_CLIENT_ID != '' }}
        uses: mnao305/chrome-extension-upload@v1.0.0
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          file-path: pickcolor-chrome-${{ github.event.inputs.tag }}.zip
          publish: true

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: [build-firefox]
    runs-on: ubuntu-latest
    if: needs.build-firefox.result == 'success'
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.tag }}
      
      - name: Download Firefox artifact
        uses: actions/download-artifact@v4
        with:
          name: pickcolor-firefox
          path: .
      
      - name: Publish to Firefox Add-ons
        if: ${{ secrets.FIREFOX_API_KEY != '' }}
        uses: mreichelt/firefox-addon-upload@v1.0.0
        with:
          firefox-api-key: ${{ secrets.FIREFOX_API_KEY }}
          firefox-api-secret: ${{ secrets.FIREFOX_API_SECRET }}
          firefox-extension-id: ${{ secrets.FIREFOX_EXTENSION_ID }}
          file-path: pickcolor-firefox-${{ github.event.inputs.tag }}.zip
          channel: listed

